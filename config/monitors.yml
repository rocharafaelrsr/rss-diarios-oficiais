project:
  title: "Diários Oficiais — ATUB, LDO e Concursos"
  description: "Publicações oficiais filtradas no DODF e no DOU."
  language: "pt-BR"
  base_url: "https://raw.githubusercontent.com/rocharafaelrsr/rss-diarios-oficiais/main/docs"
  max_items_per_feed: 300
  retention_days: 730
  lookback_days: 5
  request_timeout_seconds: 30
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36"

sources:
  dodf:
    enabled: true
    daily_url: "https://dodf.df.gov.br/dodf/jornal/diario"
    sinj_search_url: "https://www.sinj.df.gov.br/sinj/Pesquisas.aspx"
  dou:
    enabled: true
    required: true
    inlabs_base_url: "https://inlabs.in.gov.br/"
    public_search_url: "https://www.in.gov.br/consulta/-/buscar/dou"
    public_search_terms:
      - '("lei de diretrizes orçamentárias" OR "diretrizes para a elaboração e a execução da lei orçamentária") AND ${NEXT_YEAR}'
      - '(("lei de diretrizes orçamentárias" OR LDO) AND ("concurso público" OR provimento OR nomeação OR "admissão de pessoal") AND (altera OR alteração OR emenda OR veto OR retifica))'
      - '((autoriza OR autorizado OR autorizada OR autorizar) AND "concurso público")'

feeds:
  todos:
    title: "Diários Oficiais — Todos os alertas"
    description: "ATUB, LDO e autorizações de concursos no DODF e no DOU."
    categories: [atub, ldo, ldo_concursos, autorizacao_concurso]
  atub:
    title: "DODF — Concurso ATUB"
    description: "Atos relativos aos concursos da carreira Auditoria de Atividades Urbanas."
    categories: [atub]
  ldo:
    title: "DODF e DOU — LDO e concursos"
    description: "Publicação de LDO e alterações com efeito sobre concursos, provimentos e pessoal."
    categories: [ldo, ldo_concursos]
  autorizacoes-concursos:
    title: "DODF e DOU — Autorizações de concursos"
    description: "Atos que autorizem a realização de novos concursos públicos."
    categories: [autorizacao_concurso]

rules:
  - id: atub
    label: "Concurso ATUB"
    sources: [dodf]
    priority: 10
    same_act: true
    max_span_chars: 1800
    any_phrases:
      - "auditor fiscal de atividades urbanas"
      - "auditoria de atividades urbanas"
      - "auditor de atividades urbanas"
      - "carreira auditoria de atividades urbanas"
      - "edital nº 01/2022"
      - "edital n° 01/2022"
      - "edital n.º 01/2022"
      - "edital 01/2022"
      - "edital nº 1/2022"
      - "edital n° 1/2022"
      - "edital n.º 1/2022"
      - "edital 1/2022"
      - " atub "
    context_any:
      - "concurso público"
      - "concurso para auditor"
      - "concurso da carreira"
      - "certame do concurso"
      - "certame público para provimento"
      - "curso de formação"
      - "candidato do concurso"
      - "candidatos do concurso"
      - "candidata do concurso"
      - "candidatas do concurso"
      - "candidato aprovado"
      - "candidatos aprovados"
      - "candidata aprovada"
      - "candidatas aprovadas"
      - "aprovado no concurso"
      - "aprovados no concurso"
      - "aprovada no concurso"
      - "aprovadas no concurso"
      - "classificado no concurso"
      - "classificados no concurso"
      - "classificada no concurso"
      - "classificadas no concurso"
      - "cadastro de reserva"
      - "resultado final do concurso"
      - "resultado definitivo do concurso"
      - "resultado provisório do concurso"
      - "resultado final da prova"
      - "resultado definitivo da prova"
      - "resultado provisório da prova"
      - "resultado final da avaliação"
      - "resultado definitivo da avaliação"
      - "resultado provisório da avaliação"
      - "homologa o resultado final"
      - "homologa o resultado definitivo"
      - "homologação do resultado final"
      - "homologação do resultado definitivo"
      - "validade do concurso"
      - "prazo de validade do concurso"
      - "inscrição no concurso"
      - "edital normativo"
      - "edital de abertura"
      - "edital de concurso"
      - "edital para provimento"
      - "retifica o edital"
      - "retificação do edital"
      - "reposicionar para o final da lista"
      - "reposicionamento para o final da lista"
      - "final da lista de classificação"
      - "lista de classificação do concurso"
      - "edital nº 01/2022"
      - "edital n° 01/2022"
      - "edital n.º 01/2022"
      - "edital 01/2022"
      - "edital nº 1/2022"
      - "edital n° 1/2022"
      - "edital n.º 1/2022"
      - "edital 1/2022"
    context_regex:
      - '\b(?:tornar|torna)\s+sem\s+efeito\b[^.;]{0,280}\bnomea(?:cao|r)\b[^.;]{0,360}\b(?:para|no)\s+(?:o\s+)?cargo(?:\s+efetivo)?\s+(?:de\s+)?(?:auditor(?:a)?\s+fiscal\s+de\s+atividades\s+urbanas|auditor(?:a)?\s+de\s+atividades\s+urbanas|carreira\s+auditoria\s+de\s+atividades\s+urbanas)\b'
      - '\bdesistencia(?:\s+expressa)?\b[^.;]{0,280}\bnomea(?:cao|r)\b[^.;]{0,360}\b(?:para|no)\s+(?:o\s+)?cargo(?:\s+efetivo)?\s+(?:de\s+)?(?:auditor(?:a)?\s+fiscal\s+de\s+atividades\s+urbanas|auditor(?:a)?\s+de\s+atividades\s+urbanas|carreira\s+auditoria\s+de\s+atividades\s+urbanas)\b'
    unconditional_phrases:
      - "edital nº 01/2022"
      - "edital n° 01/2022"
      - "edital n.º 01/2022"
      - "edital 01/2022"
      - "edital nº 1/2022"
      - "edital n° 1/2022"
      - "edital n.º 1/2022"
      - "edital 1/2022"
    exclude_phrases:
      - "certame licitatório"
      - "procedimento licitatório"
      - "licitação"

  - id: ldo
    label: "Publicação da LDO"
    sources: [dodf, dou]
    priority: 10
    max_span_chars: 1000
    all_groups:
      - ["lei de diretrizes orçamentárias", "diretrizes orçamentárias", " ldo ", "diretrizes para a elaboração e a execução da lei orçamentária", "diretrizes para elaboração e execução da lei orçamentária"]
      - ["lei", "sanciona", "sanciono", "eu sanciono", "promulga", "publica a lei", "aprova a lei", "dispõe sobre as diretrizes", "estabelece as diretrizes"]
      - ["${NEXT_YEAR}", "exercício de ${NEXT_YEAR}", "para o exercício de ${NEXT_YEAR}"]
    exclude_phrases:
      - "jurisprudência"
      - "questão de prova"

  - id: ldo_concursos
    label: "Alteração da LDO sobre concursos"
    sources: [dodf, dou]
    priority: 10
    max_span_chars: 900
    all_groups:
      - ["lei de diretrizes orçamentárias", "diretrizes orçamentárias", " ldo ", "diretrizes para a elaboração e a execução da lei orçamentária"]
      - ["concurso público", "provimento", "nomeação", "admissão de pessoal", "criação de cargos", "cargos vagos", "anexo de pessoal", "despesa de pessoal"]
      - ["altera", "alteração", "inclui", "acrescenta", "suprime", "substitui", "retifica", "emenda", "veto"]
      - ["lei", "projeto de lei", "emenda", "veto", "mensagem"]
    exclude_phrases:
      - "homologação do resultado"
      - "resultado do concurso"
      - "curso preparatório"

  - id: autorizacao_concurso
    label: "Autorização de novo concurso"
    sources: [dodf, dou]
    priority: 10
    max_span_chars: 280
    all_groups:
      - ["autoriza", "autorizado", "autorizada", "autorizar", "fica autorizado", "fica autorizada"]
      - ["concurso público", "novo concurso público", "realizar concurso público"]
    exclude_phrases:
      - "curso preparatório"
      - "concurso de remoção"
      - "concurso cultural"
      - "licitação"
      - "jurisprudência"
      - "decisão judicial"
      - "homologação do resultado"
      - "resultado final do concurso"
