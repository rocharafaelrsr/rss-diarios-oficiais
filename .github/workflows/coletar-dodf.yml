name: Coletar DODF

on:
  schedule:
    # 07h17, 11h17, 15h17 e 19h17 no horário de Brasília (UTC-3).
    - cron: "17 10,14,18,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Compartilhado com o workflow do DOU: são autônomos, mas nunca publicam juntos.
concurrency:
  group: diarios-oficiais-publicacao
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar main atualizada
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verificar configuração obrigatória
        run: test -f config/monitors.yml || { echo "::error::config/monitors.yml ausente"; exit 1; }

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Executar testes
        run: pytest -q

      - name: Coletar DODF e gerar feeds
        id: coleta
        continue-on-error: true
        run: python src/main.py --source dodf

      - name: Validar XMLs
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          paths = sorted(Path('docs/feeds').glob('*.xml'))
          if not paths:
              raise SystemExit('Nenhum feed foi gerado.')
          for path in paths:
              root = ET.parse(path).getroot()
              assert root.tag == 'rss', f'{path}: raiz inválida'
              print(f'{path}: OK')
          PY

      - name: Publicar estado do DODF
        if: always()
        run: bash .github/scripts/publicar_estado.sh dodf

      - name: Sinalizar falha do DODF
        if: steps.coleta.outcome == 'failure'
        run: exit 1
