name: Coletar DODF

on:
  schedule:
    # 07h17 no horário de Brasília (UTC-3).
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Compartilhado com o workflow do DOU: são autônomos, mas nunca publicam juntos.
concurrency:
  group: diarios-oficiais-publicacao
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar main atualizada
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verificar configuração obrigatória
        run: test -f config/monitors.yml || { echo "::error::config/monitors.yml ausente"; exit 1; }

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Executar testes
        run: pytest -q

      - name: Coletar DODF e gerar feeds
        env:
          RSS_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python src/main_dodf.py

      - name: Validar XMLs
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          paths = sorted(Path('docs/feeds').glob('*.xml'))
          if not paths:
              raise SystemExit('Nenhum feed foi gerado.')
          for path in paths:
              root = ET.parse(path).getroot()
              assert root.tag == 'rss', f'{path}: raiz inválida'
              print(f'{path}: OK')
          PY

      - name: Publicar estado do DODF
        if: always()
        env:
          RSS_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: bash .github/scripts/publicar_estado.sh dodf

      - name: Resumir diagnóstico do DODF
        if: always()
        env:
          RSS_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from main_dodf import invalid_collection, status_belongs_to_run

          path = Path('docs/status-dodf.json')
          run_id = os.environ.get('RSS_RUN_ID', '')
          if not path.exists():
              print('status-dodf.json não foi produzido nesta execução.')
              raise SystemExit(0)

          status = json.loads(path.read_text(encoding='utf-8'))
          if not status_belongs_to_run(status, run_id):
              print('O status disponível pertence a outra execução; diagnóstico anterior não será reutilizado.')
              raise SystemExit(0)

          source = status.get('sources', {}).get('dodf', {})
          errors = status.get('errors', [])
          invalid = invalid_collection(status)
          summary = [
              '## Diagnóstico da coleta do DODF',
              '',
              f"- Documentos obtidos: **{source.get('documents', 0)}**",
              f"- Backend final: **{source.get('backend') or 'indisponível'}**",
              f"- Circuito primário aberto: **{source.get('primary_circuit_open', False)}**",
              f"- Estado e feeds atualizados: **{status.get('state_updated', False)}**",
          ]
          if errors:
              message = str(errors[-1].get('error', 'Falha não detalhada'))
              summary.extend(['', f'- Última ocorrência: {message}'])
              if invalid:
                  print(f'::notice title=DODF sem coleta válida::{message}')

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as handle:
                  handle.write('\n'.join(summary) + '\n')
          PY
