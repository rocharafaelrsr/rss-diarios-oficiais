name: Coletar DOU

on:
  schedule:
    # 07h27 no horário de Brasília (UTC-3), dez minutos após o DODF.
    - cron: "27 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Mesmo grupo do DODF: workflows independentes, execução/publicação serializada.
concurrency:
  group: diarios-oficiais-publicacao
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar main atualizada
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verificar configuração obrigatória
        run: test -f config/monitors.yml || { echo "::error::config/monitors.yml ausente"; exit 1; }

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Executar testes
        run: pytest -q

      - name: Coletar DOU e gerar feeds
        id: coleta
        continue-on-error: true
        env:
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_PASSWORD: ${{ secrets.INLABS_PASSWORD }}
        run: python src/main.py --source dou

      - name: Validar XMLs
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          paths = sorted(Path('docs/feeds').glob('*.xml'))
          if not paths:
              raise SystemExit('Nenhum feed foi gerado.')
          for path in paths:
              root = ET.parse(path).getroot()
              assert root.tag == 'rss', f'{path}: raiz inválida'
              print(f'{path}: OK')
          PY

      - name: Publicar estado do DOU
        if: always()
        env:
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_PASSWORD: ${{ secrets.INLABS_PASSWORD }}
        run: bash .github/scripts/publicar_estado.sh dou

      - name: Sinalizar falha do DOU
        if: steps.coleta.outcome == 'failure'
        run: exit 1
