name: Coletar DODF e DOU

on:
  schedule:
    # 07h, 11h, 15h e 19h no horário de Brasília (UTC-3).
    - cron: "17 10,14,18,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coletor-diarios-oficiais
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Verificar configuração obrigatória
        run: test -f config/monitors.yml

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Executar testes
        run: pytest -q

      - name: Coletar e gerar feeds
        env:
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_PASSWORD: ${{ secrets.INLABS_PASSWORD }}
        run: python src/main.py

      - name: Validar XMLs
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          paths = sorted(Path('docs/feeds').glob('*.xml'))
          if not paths:
              raise SystemExit('Nenhum feed foi gerado.')
          for path in paths:
              root = ET.parse(path).getroot()
              assert root.tag == 'rss', f'{path}: raiz inválida'
              print(f'{path}: OK')
          PY

      - name: Publicar atualizações
        run: |
          if git diff --quiet -- data/items.json docs/feeds docs/status.json; then
            echo "Sem alterações."
            exit 0
          fi
          git config user.name "rss-diarios-bot"
          git config user.email "rss-diarios-bot@users.noreply.github.com"
          git add data/items.json docs/feeds docs/status.json
          git commit -m "chore(rss): atualizar diários oficiais [skip ci]"
          git push
