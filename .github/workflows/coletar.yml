name: Coletar DODF e DOU

on:
  schedule:
    # 07h, 11h, 15h e 19h no horário de Brasília (UTC-3).
    - cron: "17 10,14,18,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coletor-diarios-oficiais
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Verificar configuração obrigatória
        run: test -f config/monitors.yml || { echo "::error::config/monitors.yml ausente"; exit 1; }

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Executar testes
        run: pytest -q

  coletar_dodf:
    name: Coletar DODF
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -e "."

      - name: Coletar DODF e gerar feeds
        id: coleta
        continue-on-error: true
        run: python src/main.py --source dodf

      - name: Validar XMLs
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          paths = sorted(Path('docs/feeds').glob('*.xml'))
          if not paths:
              raise SystemExit('Nenhum feed foi gerado.')
          for path in paths:
              root = ET.parse(path).getroot()
              assert root.tag == 'rss', f'{path}: raiz inválida'
              print(f'{path}: OK')
          PY

      - name: Publicar estado do DODF
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- data/items.json docs/feeds docs/status-dodf.json)" ]; then
            echo "Sem alterações."
          else
            git config user.name "rss-diarios-bot"
            git config user.email "rss-diarios-bot@users.noreply.github.com"
            git add data/items.json docs/feeds docs/status-dodf.json
            git commit -m "chore(rss): atualizar DODF [skip ci]"
            git push
          fi

      - name: Sinalizar falha do DODF
        if: steps.coleta.outcome == 'failure'
        run: exit 1

  coletar_dou:
    name: Coletar DOU
    needs: [validar, coletar_dodf]
    if: ${{ always() && needs.validar.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Baixar repositório atualizado
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -e "."

      - name: Coletar DOU e gerar feeds
        id: coleta
        continue-on-error: true
        env:
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_PASSWORD: ${{ secrets.INLABS_PASSWORD }}
        run: python src/main.py --source dou

      - name: Validar XMLs
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          paths = sorted(Path('docs/feeds').glob('*.xml'))
          if not paths:
              raise SystemExit('Nenhum feed foi gerado.')
          for path in paths:
              root = ET.parse(path).getroot()
              assert root.tag == 'rss', f'{path}: raiz inválida'
              print(f'{path}: OK')
          PY

      - name: Publicar estado do DOU
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- data/items.json docs/feeds docs/status-dou.json)" ]; then
            echo "Sem alterações."
          else
            git config user.name "rss-diarios-bot"
            git config user.email "rss-diarios-bot@users.noreply.github.com"
            git add data/items.json docs/feeds docs/status-dou.json
            git commit -m "chore(rss): atualizar DOU [skip ci]"
            git push
          fi

      - name: Sinalizar falha do DOU
        if: steps.coleta.outcome == 'failure'
        run: exit 1
